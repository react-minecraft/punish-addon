[versions]

paper-api = "1.21.11-R0.1-SNAPSHOT"
minecraft = "1.21.11"

react = "89f6a3a5f0"
actions = "2.1.2"
schedula = "1.1.0"

packetevents = "2.13.0"
configurate = "4.2.0"
cloud-paper = "2.0.0"

junit = "6.1.3"
junit-platform = "6.1.3"

lombok = "1.18.48"

shadow = "9.6.1"
run-task = "3.0.2"

[libraries]

paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paper-api" }

react-api = { module = "com.github.react-minecraft.plugin:react-api", version.ref = "react" }
react-common = { module = "com.github.react-minecraft.plugin:react-common", version.ref = "react" }
actions = { module = "com.github.g4vrk:FunctionalActions", version.ref = "actions" }
schedula-common = { module = "com.github.g4vrk.Schedula:common", version.ref = "schedula" }

packetevents = { module = "com.github.retrooper:packetevents-spigot", version.ref = "packetevents" }
configurate-yaml = { module = "org.spongepowered:configurate-yaml", version.ref = "configurate" }
cloud-paper = { module = "org.incendo:cloud-paper", version.ref = "cloud-paper" }

junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit-platform" }

lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }

[plugins]

shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
run-paper = { id = "xyz.jpenilla.run-paper", version.ref = "run-task" }