settings:

  # The command: /punish <type> [animation] <players> <reason>
  command: punish

types:

  kick:

    animation:
      need-to-select-in-command: true
      selected: holyworld

    actions:
      - 'kick {player.name} {reason}'

  ban:

    animation:
      need-to-select-in-command: false
      selected: holyworld

    actions:
      - 'ban {player.name} {reason}'

  mute:

    animation:
      need-to-select-in-command: true
      selected: holyworld

    actions:
      - 'mute {player.name} {reason}'